name: Build and Release Orunei APK

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://afgvxmqapzikggmasskz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZ3Z4bXFhcHppa2dnbWFzc2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjYwODEsImV4cCI6MjEwNzYwMjA4MX0.c6OPXgUJz855R1JnLayAfiUIBsAvDlFqQtLFFziD8rU' }}
          VITE_STREAM_API_URL: ${{ secrets.VITE_STREAM_API_URL || 'https://orunei-stream.thealex230820.workers.dev' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/orunei.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/orunei-latest.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orunei-apk
          path: build-output/orunei.apk
          retention-days: 30

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: 'Orunei Android App'
          body: |
            ### 📱 Orunei para Android
            Compilación automática de la aplicación oficial de Orunei.
            - Sistema de descargas para ver anime sin internet (estilo Netflix / Crunchyroll).
            - Detección automática de actualizaciones.
            - Reproductor optimizado a pantalla completa.
            
            **Descarga:** [orunei.apk](https://github.com/AndrehhX/orunei-v2/releases/download/latest/orunei.apk)
          draft: false
          prerelease: false
          files: |
            build-output/orunei.apk
            build-output/orunei-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
